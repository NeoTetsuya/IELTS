        // Helper function for Text-to-Speech
        const speakText = (text) => {
            if (!window.speechSynthesis) {
                console.warn("Speech Synthesis not supported in this browser.");
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            
            // Function to set the voice
            const setVoice = () => {
                const voices = window.speechSynthesis.getVoices();
                
                if (voices.length > 0) {
                    // 1. Try to find "Google UK English Female" specifically
                    let selectedVoice = voices.find(voice => voice.name === 'Google UK English Female');
                    
                    // 2. If not found, try to find any UK Female voice
                    if (!selectedVoice) {
                        selectedVoice = voices.find(voice => 
                            voice.lang.includes('en-GB') && 
                            (voice.name.toLowerCase().includes('female') || voice.name.toLowerCase().includes('zira'))
                        );
                    }

                    // 3. If not found, try to find any UK voice
                    if (!selectedVoice) {
                        selectedVoice = voices.find(voice => voice.lang.includes('en-GB'));
                    }
                    
                    // 4. Fallback to any female English voice
                    if (!selectedVoice) {
                        selectedVoice = voices.find(voice => 
                            voice.lang.includes('en') && 
                            voice.name.toLowerCase().includes('female')
                        );
                    }

                    if (selectedVoice) {
                        utterance.voice = selectedVoice;
                    } else {
                        // Let the system pick the default if our preferences aren't met
                        utterance.lang = 'en-GB'; 
                    }
                }
                
                // Slightly slower rate for clearer learning
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            };

            // Voices are loaded asynchronously in some browsers (like Chrome)
            if (window.speechSynthesis.getVoices().length === 0) {
                window.speechSynthesis.addEventListener('voiceschanged', setVoice, { once: true });
            } else {
                setVoice();
            }
        };

        const StudySection = ({ verbs }) => {
            const [searchTerm, setSearchTerm] = React.useState('');

            // Helper to determine verb group based on Appendix 3 logic roughly
            const getVerbType = (v) => {
                // Group 1: all same (e.g., cost, cut)
                if (v.infinitive === v.pastSimple && v.infinitive === v.pastParticiple) return 'same';
                // Group 2/3/4/5/6: usually different in at least one way
                return 'different';

                    // The prompt's PDF categorizes heavily. We'll simplify to:
                    // 'same' means past simple == past participle
                    return v.pastSimple === v.pastParticiple;

                if (filterType === 'different') {
                    return v.pastSimple !== v.pastParticiple;
                }
                return true;

                                    </th>
                                    <th scope="col" className="px-6 py-5 text-left text-xs font-black text-gray-600 uppercase tracking-widest">
                                        <span className="bg-gradient-to-r from-pink-400 to-pink-600 text-white px-3 py-1 rounded-lg shadow-sm mr-2">V3</span> Past Participle
                                    </th>
                                    <th scope="col" className="px-6 py-5 text-left text-xs font-black text-gray-600 uppercase tracking-widest">
                                        <span className="bg-gradient-to-r from-emerald-400 to-emerald-600 text-white px-3 py-1 rounded-lg shadow-sm mr-2">VN</span> Meaning
                                    </th>
                                </tr>
                            </thead>
                            <tbody className="bg-white/60 divide-y divide-gray-200/50">
                                {filteredVerbs.length > 0 ? (
                                    filteredVerbs.map((verb, index) => (
                                        <tr key={index} className="hover:bg-white transition-colors group">
                                            <td className="px-6 py-5 whitespace-nowrap text-base font-extrabold text-indigo-950 flex items-center gap-3">
                                                {verb.infinitive}
                                                <button 
                                                    onClick={() => speakText(verb.infinitive)}
                                                    className="text-gray-400 hover:text-violet-600 hover:bg-violet-50 rounded-full p-1.5 focus:outline-none transition-all scale-90 group-hover:scale-100 opacity-50 group-hover:opacity-100"
                                                    title={`Listen to "${verb.infinitive}"`}
                                                >
                                                    <i className="ph-fill ph-speaker-high text-xl"></i>
                                                </button>
                                            </td>
                                            <td className="px-6 py-5 whitespace-nowrap text-base font-medium text-gray-700 group-hover:text-gray-900 transition-colors">
                                                <div className="flex items-center gap-2">
                                                    {verb.pastSimple}
                                                    <button 
                                                        onClick={() => speakText(verb.pastSimple.replace('/', ' or '))}
                                                        className="text-gray-400 hover:text-indigo-600 focus:outline-none transition-colors"
                                                        title={`Listen to "${verb.pastSimple}"`}
                                                    >
                                                        <i className="ph ph-speaker-high text-lg"></i>
                                                    </button>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                                                <div className="flex items-center gap-2">
                                                    {verb.pastParticiple}
                                                    <button 
                                                        onClick={() => speakText(verb.pastParticiple.replace('/', ' or '))}
                                                        className="text-gray-400 hover:text-indigo-600 focus:outline-none transition-colors"
                                                        title={`Listen to "${verb.pastParticiple}"`}
                                                    >
                                                        <i className="ph ph-speaker-high text-lg"></i>
                                                    </button>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-bold text-emerald-600">
                                                {verb.vietnamese}
                                            </td>
                                        </tr>
                                    ))
                                ) : (
                                    <tr>
                                        <td colSpan="3" className="px-6 py-8 text-center text-gray-500">
                                            No verbs found matching your search.
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                    <div className="bg-gray-50 px-6 py-3 border-t border-gray-200 text-sm text-gray-500">
                        Showing {filteredVerbs.length} of {verbs.length} verbs.
                    </div>
                </div>
            );
        };

        const FlashcardSection = ({ verbs }) => {
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [isFlipped, setIsFlipped] = React.useState(false);
            const [shuffledVerbs, setShuffledVerbs] = React.useState([...verbs]);

            // Shuffle on mount
            React.useEffect(() => {
                shuffleDeck();
            }, []);

            const shuffleDeck = () => {
                const shuffled = [...verbs].sort(() => Math.random() - 0.5);
                setShuffledVerbs(shuffled);
                setCurrentIndex(0);
                setIsFlipped(false);
            };

            const nextCard = () => {
                setIsFlipped(false);
                setTimeout(() => {
                    setCurrentIndex((prev) => (prev + 1) % shuffledVerbs.length);
                }, 150); // wait for flip animation to start before changing content
            };

            const prevCard = () => {
                setIsFlipped(false);
                setTimeout(() => {
                    setCurrentIndex((prev) => (prev - 1 + shuffledVerbs.length) % shuffledVerbs.length);
                }, 150);
            };

            const currentVerb = shuffledVerbs[currentIndex];

            if (!currentVerb) return null;

            return (
                <div className="flex flex-col items-center justify-center max-w-2xl mx-auto w-full py-8 animate-fade-in-up">
                    <div className="mb-8 flex justify-between w-full items-center text-gray-600 px-4">
                        <span className="text-sm font-bold bg-gray-100 px-4 py-2 rounded-full border border-gray-200 shadow-sm">
                            Card {currentIndex + 1} of {shuffledVerbs.length}
                        </span>
                        <button 
                            onClick={shuffleDeck}
                            className="flex items-center gap-2 text-sm font-bold text-violet-600 hover:text-violet-800 hover:bg-violet-50 px-4 py-2 rounded-full transition-all"
                        >
                            <i className="ph-bold ph-shuffle"></i> Shuffle Deck
                        </button>
                    </div>

                    {/* Flashcard */}
                    <div 
                        className="w-full h-80 sm:h-[28rem] perspective-1000 cursor-pointer group transition-all duration-500 hover:-translate-y-4"
                        onClick={() => setIsFlipped(!isFlipped)}
                    >
                        <div className={`relative w-full h-full transform-style-3d flip-card-inner rounded-[3rem] pop-shadow group-hover:shadow-[0_40px_60px_-15px_rgba(139,92,246,0.3)] transition-all duration-500 ${isFlipped ? 'rotate-y-180' : ''}`}>
                            
                            {/* Front (Infinitive) */}
                            <div className="absolute w-full h-full backface-hidden glass border-4 border-white/60 rounded-[3rem] flex flex-col items-center justify-center p-8">
                                <span className="absolute top-8 right-8 bg-gradient-to-r from-blue-400 to-blue-500 text-white px-4 py-2 rounded-xl text-xs font-black tracking-widest shadow-md">V1 / INFINITIVE</span>
                                <div className="flex items-center gap-4">
                                    <h2 className="text-7xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-900 to-violet-800 text-center drop-shadow-sm">{currentVerb.infinitive}</h2>
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); speakText(currentVerb.infinitive); }}
                                        className="text-violet-400 hover:text-white hover:bg-violet-500 rounded-full transition-all p-4 shadow-sm hover:shadow-lg hover:scale-110 active:scale-95 bg-white/50 border border-violet-100"
                                        title="Listen"
                                    >
                                        <i className="ph-fill ph-speaker-high text-4xl"></i>
                                    </button>
                                </div>
                                <p className="absolute bottom-8 text-gray-500 text-sm font-bold flex items-center gap-2 bg-white/80 backdrop-blur-md px-6 py-3 rounded-full shadow-sm border border-white">
                                    <i className="ph-bold ph-hand-tap text-violet-500 text-lg"></i> Tap anywhere to flip
                                </p>
                            </div>

                            {/* Back (Past Forms) */}
                            <div className="absolute w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-violet-600 via-fuchsia-600 to-indigo-700 text-white rounded-[3rem] flex flex-col items-center justify-center p-8 border-4 border-white/20 shadow-inner">
                                <span className="absolute top-8 right-8 bg-black/20 backdrop-blur-md text-white px-4 py-2 rounded-xl text-xs font-black tracking-widest shadow-inner border border-white/10">V2 & V3 / PAST FORMS</span>
                                
                                <div className="w-full max-w-lg space-y-6">
                                    <div className="bg-white/10 backdrop-blur-md rounded-3xl p-6 text-center relative group/card border border-white/20 hover:bg-white/20 transition-all hover:scale-105 hover:shadow-lg">
                                        <div className="text-white/70 text-sm font-black uppercase tracking-widest mb-3">Past Simple (V2)</div>
                                        <div className="text-5xl font-black flex items-center justify-center gap-4 text-glow">
                                            {currentVerb.pastSimple}
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); speakText(currentVerb.pastSimple.replace('/', ' or ')); }}
                                                className="text-white/70 hover:text-white transition-all opacity-0 group-hover/card:opacity-100 focus:opacity-100 bg-black/10 hover:bg-black/30 rounded-full p-3 shadow-inner"
                                                title="Listen"
                                            >
                                                <i className="ph-fill ph-speaker-high text-3xl"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div className="bg-white/10 backdrop-blur-md rounded-3xl p-6 text-center relative group/card border border-white/20 hover:bg-white/20 transition-all hover:scale-105 hover:shadow-lg">
                                        <div className="text-white/70 text-sm font-black uppercase tracking-widest mb-3">Past Participle (V3)</div>
                                        <div className="text-5xl font-black flex items-center justify-center gap-4 text-glow">
                                            {currentVerb.pastParticiple}
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); speakText(currentVerb.pastParticiple.replace('/', ' or ')); }}
                                                className="text-white/70 hover:text-white transition-all opacity-0 group-hover/card:opacity-100 focus:opacity-100 bg-black/10 hover:bg-black/30 rounded-full p-3 shadow-inner"
                                                title="Listen"
                                            >
                                                <i className="ph-fill ph-speaker-high text-3xl"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    {/* Controls */}
                    <div className="flex gap-6 mt-12 w-full justify-center">
                        <button 
                            onClick={(e) => { e.stopPropagation(); prevCard(); }}
                            className="bg-white/80 backdrop-blur-sm border-2 border-white text-gray-700 p-5 rounded-full shadow-lg hover:bg-white hover:text-violet-600 focus:outline-none transition-all hover:scale-110 active:scale-95"
                            aria-label="Previous card"
                        >
                            <i className="ph-bold ph-caret-left text-2xl"></i>
                        </button>
                        <button 
                            onClick={(e) => { e.stopPropagation(); nextCard(); }}
                            className="bg-gradient-to-r from-violet-600 to-indigo-600 text-white p-5 rounded-full shadow-[0_15px_30px_-5px_rgba(139,92,246,0.4)] hover:shadow-[0_20px_40px_-5px_rgba(139,92,246,0.5)] hover:-translate-y-1 focus:outline-none transition-all hover:scale-110 active:scale-95"
                            aria-label="Next card"
                        >
                            <i className="ph-bold ph-caret-right text-2xl"></i>
                        </button>
                    </div>
                </div>
            );
        };

        const QuizSection = ({ verbs }) => {
            const [gameState, setGameState] = React.useState('start'); // start, playing, finished
            const [questions, setQuestions] = React.useState([]);
            const [currentQIndex, setCurrentQIndex] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [streak, setStreak] = React.useState(0);
            const [isShaking, setIsShaking] = React.useState(false);
            
            // User inputs
            const [inputV2, setInputV2] = React.useState('');
            const [inputV3, setInputV3] = React.useState('');
            const [feedback, setFeedback] = React.useState(null); // { type: 'success'|'error', msg: string }

            const totalQuestions = 10;

            const startQuiz = () => {
                const shuffled = [...verbs].sort(() => Math.random() - 0.5).slice(0, totalQuestions);
                setQuestions(shuffled);
                setCurrentQIndex(0);
                setScore(0);
                setStreak(0);
                setInputV2('');
                setInputV3('');
                setFeedback(null);
                setGameState('playing');
            };

            const normalizeInput = (str) => {
                // handle cases like "burned/burnt" by accepting either or both
                return str.toLowerCase().trim().replace(/\s+/g, '');
            };

            const checkAnswers = () => {
                const currentVerb = questions[currentQIndex];
                
                // Allow exact match or match of one of the options separated by '/'
                const v2Options = currentVerb.pastSimple.split('/');
                const v3Options = currentVerb.pastParticiple.split('/');
                
                const isV2Correct = v2Options.some(opt => normalizeInput(opt) === normalizeInput(inputV2));
                const isV3Correct = v3Options.some(opt => normalizeInput(opt) === normalizeInput(inputV3));

                if (isV2Correct && isV3Correct) {
                    setFeedback({ type: 'success', msg: 'Awesome! Spot on! 🎉' });
                    setScore(prev => prev + 1);
                    setStreak(prev => prev + 1);

                    // Small confetti burst on correct answer if streak is building
                    if (streak >= 1 && typeof confetti === 'function') {
                        confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 }, colors: ['#8b5cf6', '#3b82f6', '#f59e0b'] });
                    }
                    
                    setTimeout(nextQuestion, 1500);
                } else {
                    let msg = 'Not quite right. ';
                    if (!isV2Correct && !isV3Correct) msg += `Past Simple is "${currentVerb.pastSimple}", Past Participle is "${currentVerb.pastParticiple}".`;
                    else if (!isV2Correct) msg += `Past Simple should be "${currentVerb.pastSimple}".`;
                    else if (!isV3Correct) msg += `Past Participle should be "${currentVerb.pastParticiple}".`;
                    
                    setFeedback({ type: 'error', msg: msg });
                    setStreak(0);
                    setIsShaking(true);
                    setTimeout(() => setIsShaking(false), 500);
                }
            };

            const nextQuestion = () => {
                if (currentQIndex + 1 < totalQuestions) {
                    setCurrentQIndex(prev => prev + 1);
                    setInputV2('');
                    setInputV3('');
                    setFeedback(null);
                } else {
                    setGameState('finished');
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !feedback) {
                    checkAnswers();
                } else if (e.key === 'Enter' && feedback && feedback.type === 'error') {
                    nextQuestion();
                }
            };

            if (gameState === 'start') {
                return (
                    <div className="flex flex-col items-center justify-center py-24 max-w-2xl mx-auto text-center animate-fade-in-up glass rounded-3xl pop-shadow border-2 border-white/60 px-8">
                        <div className="w-40 h-40 bg-gradient-to-br from-violet-400 via-fuchsia-500 to-indigo-600 text-white rounded-[2.5rem] shadow-2xl rotate-6 flex items-center justify-center mb-10 card-hover transition-transform duration-500 hover:rotate-12 hover:scale-110 border-4 border-white/30">
                            <i className="ph-fill ph-rocket-launch text-7xl -rotate-6"></i>
                        </div>
                        <h2 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-900 to-indigo-900 mb-6 tracking-tight">Ready to test your memory?</h2>
                        <p className="text-xl text-gray-600 mb-12 leading-relaxed font-medium">
                            You will be given <span className="font-black text-fuchsia-600 text-2xl bg-fuchsia-100 px-3 py-1 rounded-xl mx-1 shadow-sm">{totalQuestions}</span> random infinitive verbs. 
                            Type in the correct Past Simple and Past Participle forms for each to build your streak!
                        </p>
                        <button 
                            onClick={startQuiz}
                            className="bg-gradient-to-r from-violet-600 via-fuchsia-600 to-indigo-600 text-white font-black text-2xl py-5 px-14 rounded-3xl shadow-[0_20px_40px_-10px_rgba(192,38,211,0.4)] transition-all transform hover:-translate-y-2 hover:shadow-[0_25px_50px_-10px_rgba(192,38,211,0.5)] active:scale-95 flex items-center gap-4"
                        >
                            <i className="ph-bold ph-play"></i> Start Challenge
                        </button>
                    </div>
                );
            }

            if (gameState === 'finished') {
                const percentage = (score / totalQuestions) * 100;
                let message = "";
                if (percentage === 100) message = "Perfect Score! You are a verb master! 🏆";
                else if (percentage >= 80) message = "Great job! You know these well. 🌟";
                else if (percentage >= 50) message = "Good effort, keep practicing! 💪";
                else message = "Time to hit the flashcards again. 📚";

                // Trigger massive confetti on high score
                React.useEffect(() => {
                    if (percentage >= 80 && typeof confetti === 'function') {
                        const duration = 3000;
                        const animationEnd = Date.now() + duration;
                        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                        const interval = setInterval(function() {
                            const timeLeft = animationEnd - Date.now();
                            if (timeLeft <= 0) return clearInterval(interval);
                            const particleCount = 50 * (timeLeft / duration);
                            confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random(), y: Math.random() - 0.2 } }));
                        }, 250);
                    }
                }, [percentage]);

                return (
                    <div className="flex flex-col items-center justify-center py-20 max-w-lg mx-auto text-center animate-fade-in-up glass rounded-3xl pop-shadow border-2 border-white/60 px-8">
                        <div className="mb-10 relative">
                            <svg className="w-48 h-48 transform -rotate-90 drop-shadow-xl">
                                <circle cx="96" cy="96" r="80" stroke="currentColor" strokeWidth="16" fill="transparent" className="text-white/60" />
                                <circle cx="96" cy="96" r="80" stroke="url(#gradient)" strokeWidth="16" fill="transparent" 
                                    strokeDasharray={502} 
                                    strokeDashoffset={502 - (502 * percentage) / 100}
                                    strokeLinecap="round"
                                    className="transition-all duration-1000 ease-out" 
                                />
                                <defs>
                                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                        <stop offset="0%" stopColor="#c026d3" />
                                        <stop offset="100%" stopColor="#4f46e5" />
                                    </linearGradient>
                                </defs>
                            </svg>
                            <div className="absolute inset-0 flex flex-col items-center justify-center">
                                <span className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-600 to-indigo-600 drop-shadow-sm">{score}/{totalQuestions}</span>
                            </div>
                        </div>
                        <h2 className="text-4xl font-black text-gray-900 mb-3">Challenge Complete!</h2>
                        <p className="text-xl text-gray-600 mb-12 font-bold">{message}</p>
                        
                        <div className="flex flex-col sm:flex-row gap-4 w-full justify-center">
                            <button 
                                onClick={startQuiz}
                                className="bg-gradient-to-r from-violet-600 via-fuchsia-600 to-indigo-600 text-white font-black py-4 px-10 rounded-2xl shadow-[0_15px_30px_-5px_rgba(192,38,211,0.4)] transition-all hover:scale-105 active:scale-95"
                            >
                                Play Again
                            </button>
                            <button 
                                onClick={() => setGameState('start')}
                                className="bg-white/80 backdrop-blur-sm border-2 border-white hover:bg-white text-gray-700 font-bold py-4 px-10 rounded-2xl shadow-md transition-all hover:scale-105 active:scale-95"
                            >
                                Back to Start
                            </button>
                        </div>
                    </div>
                );
            }

            const currentVerb = questions[currentQIndex];

            return (
                <div className="max-w-2xl mx-auto py-8 animate-fade-in-up">
                    {/* Progress Bar and Streak */}
                    <div className="mb-10">
                        <div className="flex justify-between items-end text-sm font-medium text-gray-500 mb-4">
                            <span className="font-black bg-white/60 backdrop-blur-sm px-4 py-2 rounded-xl shadow-sm border border-white">Question {currentQIndex + 1} of {totalQuestions}</span>
                            <div className="flex items-center gap-4">
                                {streak > 1 && (
                                    <span className="text-orange-600 font-black flex items-center gap-1 animate-bounce bg-orange-100 px-4 py-2 rounded-xl border-2 border-orange-200 shadow-md">
                                        <i className="ph-fill ph-fire text-xl"></i> {streak} Streak!
                                    </span>
                                )}
                                <span className="bg-gradient-to-r from-indigo-600 to-violet-600 text-white px-5 py-2 rounded-xl text-base font-black shadow-md">Score: {score}</span>
                            </div>
                        </div>
                        <div className="w-full bg-white/40 backdrop-blur-sm rounded-full h-4 shadow-inner overflow-hidden border border-white/60">
                            <div className="bg-gradient-to-r from-fuchsia-500 to-indigo-500 h-4 rounded-full transition-all duration-500 ease-out relative" style={{ width: `${((currentQIndex) / totalQuestions) * 100}%` }}>
                                <div className="absolute inset-0 bg-white/20"></div>
                            </div>
                        </div>
                    </div>

                    <div className={`glass rounded-[2.5rem] pop-shadow border-2 border-white/60 overflow-hidden ${isShaking ? 'animate-shake' : ''}`}>
                        <div className="bg-white/40 border-b border-indigo-100/50 p-10 text-center relative backdrop-blur-sm">
                            <span className="text-sm font-black text-indigo-500 uppercase tracking-widest block mb-4 bg-white shadow-sm inline-block px-4 py-2 rounded-full border border-indigo-100">Infinitive</span>
                            <div className="flex items-center justify-center gap-4">
                                <h3 className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-900 to-violet-800 drop-shadow-sm">{currentVerb.infinitive}</h3>
                                <button 
                                    onClick={() => speakText(currentVerb.infinitive)}
                                    className="text-violet-500 hover:text-white hover:bg-violet-500 rounded-full p-3 transition-all focus:outline-none shadow-md bg-white border-2 border-violet-100 hover:scale-110 active:scale-95"
                                    title="Listen"
                                >
                                    <i className="ph-fill ph-speaker-high text-4xl"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div className="p-10 space-y-8 bg-white/60">
                            <div>
                                <label className="block text-base font-black text-gray-700 mb-3 flex items-center gap-3">
                                    <span className="bg-gradient-to-r from-purple-400 to-purple-600 text-white px-3 py-1 rounded-lg text-sm shadow-md">V2</span> Past Simple
                                </label>
                                <input 
                                    type="text" 
                                    value={inputV2}
                                    onChange={(e) => setInputV2(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                    disabled={feedback?.type === 'success'}
                                    className="w-full px-6 py-5 bg-white/80 backdrop-blur-md border-2 border-white/80 rounded-2xl focus:ring-4 focus:ring-violet-500/20 focus:border-violet-500 transition-all disabled:bg-gray-100/50 disabled:text-gray-500 text-2xl font-bold shadow-inner outline-none text-indigo-900"
                                    placeholder="e.g. went"
                                    autoComplete="off"
                                    autoFocus
                                />
                            </div>
                            
                            <div>
                                <label className="block text-base font-black text-gray-700 mb-3 flex items-center gap-3">
                                    <span className="bg-gradient-to-r from-pink-400 to-pink-600 text-white px-3 py-1 rounded-lg text-sm shadow-md">V3</span> Past Participle
                                </label>
                                <input 
                                    type="text" 
                                    value={inputV3}
                                    onChange={(e) => setInputV3(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                    disabled={feedback?.type === 'success'}
                                    className="w-full px-6 py-5 bg-white/80 backdrop-blur-md border-2 border-white/80 rounded-2xl focus:ring-4 focus:ring-fuchsia-500/20 focus:border-fuchsia-500 transition-all disabled:bg-gray-100/50 disabled:text-gray-500 text-2xl font-bold shadow-inner outline-none text-indigo-900"
                                    placeholder="e.g. gone"
                                    autoComplete="off"
                                />
                            </div>

                            {feedback && (
                                <div className={`p-6 rounded-2xl flex items-start gap-4 animate-fade-in-up shadow-md border-2 ${feedback.type === 'success' ? 'bg-green-50/90 text-green-800 border-green-200 backdrop-blur-sm' : 'bg-red-50/90 text-red-800 border-red-200 backdrop-blur-sm'}`}>
                                    <i className={`ph-fill ${feedback.type === 'success' ? 'ph-check-circle text-green-500' : 'ph-warning-circle text-red-500'} text-3xl mt-0.5 drop-shadow-sm`}></i>
                                    <div>
                                        <p className="font-bold text-xl">{feedback.msg}</p>
                                    </div>
                                </div>
                            )}

                            <div className="pt-8 flex justify-end border-t border-gray-200/50">
                                {!feedback ? (
                                    <button 
                                        onClick={checkAnswers}
                                        disabled={!inputV2.trim() || !inputV3.trim()}
                                        className="bg-gradient-to-r from-violet-600 via-fuchsia-600 to-indigo-600 disabled:from-gray-300 disabled:to-gray-400 disabled:shadow-none text-white font-black text-lg py-5 px-10 rounded-2xl shadow-[0_15px_30px_-5px_rgba(192,38,211,0.4)] transition-all hover:-translate-y-1 hover:shadow-[0_20px_40px_-5px_rgba(192,38,211,0.5)] active:scale-95 disabled:cursor-not-allowed w-full sm:w-auto"
                                    >
                                        Check Answers
                                    </button>
                                ) : (
                                    <button 
                                        onClick={nextQuestion}
                                        className="bg-gray-900 hover:bg-black text-white font-black text-lg py-5 px-10 rounded-2xl shadow-xl transition-all hover:scale-105 active:scale-95 flex items-center justify-center gap-3 w-full sm:w-auto"
                                    >
                                        {currentQIndex + 1 < totalQuestions ? 'Next Verb' : 'See Results'} <i className="ph-bold ph-arrow-right text-xl"></i>
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
